[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
\n"""
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]($REPO/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){%- endif %}\
{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]($REPO/pull/{{ commit.remote.pr_number }}){%- else %} ([{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})){%- endif %}
{% endfor %}
{% endfor %}\
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New contributors

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}\
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]($REPO/pull/{{ contributor.pr_number }}){% endif %}
{% endfor %}
{% endif %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  { pattern = '\$REPO', replace = "https://github.com/lexmiin/evocomp" },
]

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
commit_parsers = [
  { message = '^release:', skip = true },
  { message = '^Merge ', skip = true },
  { body = '(?i)security', group = "<!-- 00 -->Security" },
  { message = '^(docs?|readme)(\([^)]+\))?:', group = "<!-- 02 -->Documentation" },
  { message = '^(ci|chore|test)(\([^)]+\))?:', group = "<!-- 03 -->Internal" },
  { message = '.', group = "<!-- 01 -->Changes" },
]
protect_breaking_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "lexmiin"
repo = "evocomp"
