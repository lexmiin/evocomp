name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml (without the v prefix)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch ($DEFAULT_BRANCH), not $GITHUB_REF_NAME."
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $RELEASE_VERSION (expected X.Y.Z)"
            exit 1
          fi

          project_version="$(python3 - <<'PY'
          import tomllib

          with open('pyproject.toml', 'rb') as pyproject:
              print(tomllib.load(pyproject)['project']['version'])
          PY
          )"

          if [[ "$RELEASE_VERSION" != "$project_version" ]]; then
            echo "Requested version $RELEASE_VERSION does not match pyproject.toml ($project_version)."
            exit 1
          fi

          set +e
          tag_lookup="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>&1)"
          tag_status=$?
          set -e

          if (( tag_status == 0 )); then
            echo "Tag $TAG already exists."
            exit 1
          fi
          if [[ "$tag_lookup" != *"HTTP 404"* ]]; then
            echo "$tag_lookup"
            exit "$tag_status"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.18

      - name: Extract reviewed release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: uv run --frozen python scripts/prepare_release.py notes "$RELEASE_VERSION"

      - name: Build wheel and source distribution
        run: |
          uv lock --check
          uv build --out-dir dist

      - name: Verify release distributions
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          uvx --from twine==6.2.0 twine check --strict dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload reviewed release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/evocomp/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Publish release distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-github:
    name: Create tag and GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Download reviewed release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ./

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          TAG: v${{ inputs.version }}
        run: |
          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TAG"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" dist/*
